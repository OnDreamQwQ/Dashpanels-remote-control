modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
Opens a Dashpanels panel on a screen and lets you work it from a hand-held remote. The panels are
drawn by their own renderers, so every module - including ones added by other addons - looks and
behaves exactly like it does in the world. Needs a panel remote receiver attached to the panel.
'''

[[mixins]]
config = "drc.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "dashpanels"
type = "required"
versionRange = "[2.0,)"
ordering = "AFTER"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "aeroworks"
type = "optional"
versionRange = "[1.5.0,)"
ordering = "AFTER"
side = "BOTH"